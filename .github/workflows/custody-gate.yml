name: WAYBACK / RMR-boundary evidence gate
on:
  pull_request:
    paths:
      - "core/**"
      - "host/**"
      - "tests/**"
      - "001_PONTEIRO/**"
      - "governance/**"
      - ".github/workflows/custody-gate.yml"
  workflow_dispatch:
    inputs:
      run_live:
        description: "Explicitly allow ONE public, read-only retrieval. No cron/crawl/forms."
        type: boolean
        default: false
        required: true
      target:
        description: "Allowlisted URL only"
        type: choice
        options: [reisoffice, cesarreis, geocities, cesarreis_2005]
        default: geocities
        required: true
      human_public_fetch_authorization:
        description: "I approve one public GET, within read-only/privacy limits"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: wayback-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-gates:
    name: Freestanding source + negative fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact source with no persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert source HEAD before testing
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Hosted adapter adversarial tests (network-free)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_wayback.py' -v
          python3 -m py_compile host/observe.py
      - name: Host C test and three freestanding object compile gates
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Werror -pedantic core/raf_html_indicators.c tests/test_core.c -o /tmp/raf-html-gate
          /tmp/raf-html-gate
          mkdir -p out/objects
          for arch in x86_64-unknown-none armv7-none-eabi aarch64-none-elf; do
            clang "--target=$arch" -std=c99 -O2 -Wall -Wextra -Werror \
              -ffreestanding -fno-builtin -fno-stack-protector \
              -c core/raf_html_indicators.c -o "out/objects/$arch.o"
            test -z "$(nm -u "out/objects/$arch.o")"
            readelf -h "out/objects/$arch.o" > "out/objects/$arch.elf.txt"
            sha256sum "out/objects/$arch.o" > "out/objects/$arch.SHA256SUMS"
          done
          printf '%s\n' 'IMPLEMENTATION=freestanding object, not physical-device execution' > out/objects/SCOPE.txt
      - name: Produce synthetic receipt without networking
        run: |
          set -euo pipefail
          python3 host/observe.py --mode synthetic --output out/synthetic
          ( cd out/synthetic && sha256sum -c SHA256SUMS )
      - name: Publish test-only artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wayback-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 90

  manually-authorized-public-get:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live && inputs.human_public_fetch_authorization }}
    needs: synthetic-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One allowlisted GET; never follow redirects or submit forms
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            reisoffice|cesarreis|geocities|cesarreis_2005) ;;
            *) echo 'BLOCKED_INVALID_TARGET'; exit 1 ;;
          esac
          mkdir -p out
          python3 host/observe.py --mode live --target "$TARGET" \
            --manual-public-fetch-authorization --output out/public-get
      - name: Upload verification receipt (never raw page data)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wayback-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/public-get/
          if-no-files-found: warn
          retention-days: 90
